# Caller for pedrobtz/r-actions, copied from its examples/r-cmd-check.yml.
on:
  # No `push:`: a pull request already checks its merge with main, and the
  # schedule checks main (r-actions README, "Pushes to main").
  # `labeled`/`unlabeled` so that adding or removing a CI label (`full-ci`,
  # `ci:docs`, `ci:minimal`, `skip-ci:<workflow>`) reruns it.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The full set runs weekly, in openlineage's Saturday slot, and on demand:
  # `gh workflow run R-CMD-check.yaml --ref main`.
  schedule:
    - cron: "34 10 * * 6"
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

# A new push to a pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    # Decided without a runner. `ci:minimal` still runs one quick check, so
    # it is not tested here.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:R-CMD-check'))
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      # Quick on pull requests. Full on the weekly schedule, on a manual
      # dispatch, and on a pull request labelled `full-ci`.
      profile: auto
      # openlineage is pure R: the CRAN-compiler containers have nothing to
      # compile.
      containers: '[]'
      quick-containers: '[]'
      # CRAN's noLD flavor (R built --disable-long-double), full profile only.
      # The package formats and parses doubles, which is what it exercises
      # (#96).
      nold: true
      # The r-actions default plus Windows R-devel, CRAN's flavor that no
      # other leg checks (full profile only).
      runners: >-
        [{"os": "macos-latest", "r": "release"},
         {"os": "windows-latest", "r": "release"},
         {"os": "windows-latest", "r": "devel"},
         {"os": "ubuntu-latest", "r": "release"},
         {"os": "ubuntu-latest", "r": "oldrel-1"}]
